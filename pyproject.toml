[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-watch"
version = "0.1.0"
description = "Zero-dependency AI vendor API structural drift detection engine & CI gate."
readme = "README.md"
authors = [
  { name = "CodeHarsh", email = "harsh@oximy.ai" }
]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "rich>=12.0.0",
    "pyyaml>=6.0"
]

[tool.setuptools]
packages = ["core"]

[project.scripts]
driftwatch = "core.cli:main"

[project.urls]
Homepage = "https://drift-watch-one.vercel.app/"
Repository = "https://github.com/codeharsh27/drift-watch"
